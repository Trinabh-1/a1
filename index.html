<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Alliance Engine</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181d;
    --panel2: #1a1f26;
    --line: #262d36;
    --text: #d7dde3;
    --dim: #7c8894;
    --accent: #ff7a3d;
    --accent2: #4fc3a1;
    --mono: 'SF Mono', 'Courier New', monospace;
    --sans: -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    margin: 0; padding: 10px; min-height: 100vh; font-size: 14px;
    max-width: 100vw; overflow-x: hidden;
  }
  h1 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--dim); font-weight: 600; margin: 4px 0 2px 0;
  }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 11px; color: var(--dim); margin-bottom: 14px; line-height: 1.4; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; max-width: 100%;
  }
  .panel + .panel { margin-top: 12px; }
  .panel-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--dim); margin-bottom: 10px; font-weight: 600;
  }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; table-layout: fixed; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 4px 3px; border-bottom: 1px solid var(--line); }
  td { padding: 4px 3px; border-bottom: 1px solid #1c2127; overflow: hidden; text-overflow: ellipsis; }
  td input {
    width: 100%; background: transparent; border: none; color: var(--text);
    font-family: var(--mono); font-size: 12px; padding: 4px 2px; min-width: 0;
  }
  td input:focus { outline: 1px solid var(--accent); border-radius: 3px; }
  .team-table-wrap { max-height: 260px; overflow-y: auto; overflow-x: hidden; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
  .rank-col { color: var(--dim); width: 32px; }
  .captain-badge {
    display: inline-block; font-size: 8px; padding: 1px 4px; border-radius: 3px;
    background: rgba(255,122,61,0.15); color: var(--accent); margin-left: 4px; white-space: nowrap;
  }
  button {
    font-family: var(--sans); font-size: 13px; font-weight: 600; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    padding: 11px 12px; cursor: pointer; transition: all 0.15s;
    min-height: 44px; -webkit-appearance: none; touch-action: manipulation;
  }
  button:hover:not(.choice-btn):not(.cand-box-btn) { border-color: var(--accent); color: var(--accent); }
  .choice-btn:hover { border-color: #3a4149; color: var(--text); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a0d05; }
  button.primary:hover { background: #ff8f5c; color: #1a0d05; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .btn-row button { flex: 1; }
  .hint { font-size: 11px; color: var(--dim); line-height: 1.5; margin-top: 8px; }
  .candidates { display: flex; flex-direction: column; gap: 12px; }
  .cand-row { display: flex; align-items: stretch; gap: 6px; margin-bottom: 8px; }
  .cand-box {
    display: block; flex: 1; min-width: 0; text-align: left; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 9px; background: var(--panel2); font-family: var(--mono);
  }
  .cand-box.leading { border-color: var(--accent2); }
  .choose-btn {
    flex-shrink: 0; width: 64px; font-size: 11px; padding: 6px 4px; white-space: normal; line-height: 1.2;
  }
  .cand-box-btn {
    width: 100%; min-height: 0; font-weight: normal; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .cand-box-btn:hover { border-color: #3a4149; color: var(--text); }
  .cand-box-btn.leading:hover { border-color: var(--accent2); }
  .cand-box-btn:active { background: #20262d; }
  .cand-box-flex { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .cb-left { display: flex; flex-direction: column; justify-content: space-between; gap: 2px; min-height: 68px; }
  .cb-right { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; gap: 3px; font-size: 12px; min-height: 68px; }
  .cb-team { font-weight: 700; font-size: 14px; color: var(--text); }
  .cb-mean { color: var(--text); font-size: 12px; }
  .cb-green { color: #4fc37a; }
  .cb-red { color: #e05a5a; }
  .cb-blue { color: #5a9ee0; }
  .cb-yellow { color: #e0c95a; }
  .cb-ev { font-weight: 700; color: var(--accent2); font-size: 26px; line-height: 1.1; }
  .cb-status { font-size: 10px; color: var(--dim); margin-top: 4px; }
  .decision-header { font-size: 13px; color: var(--text); margin-bottom: 10px; font-family: var(--mono); }
  .cand-card {
    border: 1px solid var(--line); border-radius: 8px; padding: 14px;
    background: var(--panel2); position: relative; overflow: hidden;
  }
  .cand-card.leading { border-color: var(--accent2); }
  .cand-card.leading::before {
    content: 'LEADING'; position: absolute; top: 10px; right: 14px;
    font-size: 9px; letter-spacing: 0.08em; color: var(--accent2); font-weight: 700;
  }
  .cand-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .cand-team { font-family: var(--mono); font-size: 15px; font-weight: 700; }
  .cand-stats-line { font-size: 11px; color: var(--dim); font-family: var(--mono); }
  .ev-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .ev-value { font-family: var(--mono); font-size: 28px; font-weight: 700; color: var(--accent2); }
  .ev-label { font-size: 11px; color: var(--dim); }
  .ev-delta { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  canvas.spark { width: 100%; height: 48px; display: block; margin-bottom: 10px; }
  .stat-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
    font-family: var(--mono); font-size: 11px; color: var(--text);
  }
  .stat-grid div b { color: var(--text); display: block; font-size: 13px; font-weight: 600; }
  .status-line { font-size: 11px; color: var(--dim); margin-top: 6px; font-family: var(--mono); }
  .worker-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--dim); margin-right: 5px;
  }
  .worker-dot.active { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
  .final-banner {
    background: rgba(79,195,161,0.1); border: 1px solid var(--accent2); border-radius: 8px;
    padding: 14px; margin-top: 12px; font-size: 13px; display: none;
  }
  .final-banner.show { display: block; }
  .final-banner b { color: var(--accent2); }
</style>
</head>
<body>

<h1>Alliance <span>Engine v1</span></h1>
<div class="subtitle" id="topSubtitle"></div>

<div id="setupPanels">
<div class="panel">
  <div class="panel-title">Import from TBA</div>
  <input id="tbaKey" type="password" placeholder="TBA Read API key" style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:11px 8px;font-family:var(--mono);font-size:13px;margin-bottom:8px;min-height:44px;">
  <input id="tbaEvent" type="text" value="2026cthar" placeholder="Event key" style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:11px 8px;font-family:var(--mono);font-size:13px;margin-bottom:8px;min-height:44px;">
  <button id="btnImportTBA" class="primary" style="width:100%;">Import Qualification Results</button>
  <div class="hint" id="tbaStatus"></div>
</div>

<div class="panel">
  <div class="panel-title">Rankings</div>
  <div class="team-table-wrap">
    <table>
      <thead><tr><th class="rank-col"></th><th>Team</th><th>CODPR</th><th>Var</th></tr></thead>
      <tbody id="teamTableBody"></tbody>
    </table>
  </div>
  </div>

<div class="panel">
  <div class="panel-title">Alliance Selection</div>
  <div class="hint" style="margin-bottom:8px;">Pick which team you are.</div>
  <select id="wtTeamSelect" style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:11px 8px;font-family:var(--mono);font-size:13px;margin-bottom:8px;min-height:44px;"></select>
  <button id="btnStartWalkthrough" class="primary" style="width:100%;">Start</button>
</div>
</div>

<div id="walkthroughPanel" class="panel" style="display:none;">
  <div class="hint" style="margin-bottom:10px;"><a href="#" id="btnBackToSetup" style="color:var(--dim);">← back to setup</a> &nbsp;·&nbsp; <span id="wtWhoAmI"></span></div>
  <div class="stat-grid" id="wtRosterBoard" style="margin-bottom:14px;"></div>
  <div id="wtDecisionPanel"></div>
  <div class="btn-row" style="margin-top:14px;">
    <button id="btnUndo" disabled>Undo</button>
    <button id="btnResetWalkthrough">Restart</button>
  </div>
  <div class="hint" style="margin-top:10px;"><b>History</b></div>
  <div id="wtHistoryLog" style="font-family:var(--mono);font-size:11px;color:var(--dim);max-height:160px;overflow-y:auto;line-height:1.6;"></div>
</div>

<script id="worker-src" type="javascript/worker">
// ============================================================
// Ported from the Node.js prototype - same algorithm, browser Worker.
// ============================================================
function erf(x) {
  const sign = x < 0 ? -1 : 1; x = Math.abs(x);
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const t = 1 / (1 + p * x);
  const y = 1 - (((((a5*t+a4)*t)+a3)*t+a2)*t+a1) * t * Math.exp(-x*x);
  return sign * y;
}
function normalCDF(x) { return 0.5 * (1 + erf(x / Math.SQRT2)); }
function winProb(meanA, varA, meanB, varB) {
  const sigma = Math.sqrt(varA + varB) || 1e-6;
  return normalCDF((meanA - meanB) / sigma);
}

const BRACKET_MATCHES = [
  { id: 'M1',  red: { t: 'seed', s: 0 }, blue: { t: 'seed', s: 7 } },
  { id: 'M2',  red: { t: 'seed', s: 3 }, blue: { t: 'seed', s: 4 } },
  { id: 'M3',  red: { t: 'seed', s: 1 }, blue: { t: 'seed', s: 6 } },
  { id: 'M4',  red: { t: 'seed', s: 2 }, blue: { t: 'seed', s: 5 } },
  { id: 'M5',  red: { t: 'loser', m: 'M1' }, blue: { t: 'loser', m: 'M2' } },
  { id: 'M6',  red: { t: 'loser', m: 'M3' }, blue: { t: 'loser', m: 'M4' } },
  { id: 'M7',  red: { t: 'winner', m: 'M1' }, blue: { t: 'winner', m: 'M2' } },
  { id: 'M8',  red: { t: 'winner', m: 'M3' }, blue: { t: 'winner', m: 'M4' } },
  { id: 'M9',  red: { t: 'loser', m: 'M7' }, blue: { t: 'winner', m: 'M6' } },
  { id: 'M10', red: { t: 'loser', m: 'M8' }, blue: { t: 'winner', m: 'M5' } },
  { id: 'M11', red: { t: 'winner', m: 'M7' }, blue: { t: 'winner', m: 'M8' } },
  { id: 'M12', red: { t: 'winner', m: 'M9' }, blue: { t: 'winner', m: 'M10' } },
  { id: 'M13', red: { t: 'loser', m: 'M11' }, blue: { t: 'winner', m: 'M12' } },
];
const MATCH_INDEX = {};
BRACKET_MATCHES.forEach((m, i) => { MATCH_INDEX[m.id] = i; });
const M11_IDX = MATCH_INDEX['M11'], M13_IDX = MATCH_INDEX['M13'], M12_IDX = MATCH_INDEX['M12'];
const NUM_MATCHES = BRACKET_MATCHES.length;

// numAlliances: the bracket SHAPE (Figure 11-3) never changes - per the FRC
// game manual, events with fewer than 8 alliances "remain as shown in
// Figure 11-3, with any matchup against a non-existent ALLIANCE resulting
// in a bye (i.e. automatic advancement)". So seeds 0..numAlliances-1 exist
// and play real matches; seeds numAlliances..7 are phantom slots that never
// actually take the field - any match involving a phantom seed auto-resolves
// to the real side with probability 1 (no coin flip), and a match between
// two phantom seeds is just bookkeeping (its "winner" is never a real
// alliance, so it never affects anyone's EV downstream).
function bracketEV(meanArr, varArr, numAlliances) {
  const redOf = new Int8Array(NUM_MATCHES);
  const blueOf = new Int8Array(NUM_MATCHES);
  const winnerOf = new Int8Array(NUM_MATCHES);
  const value = new Array(8).fill(0);
  function isReal(seed) { return seed < numAlliances; }
  function resolve(ref) {
    if (ref.t === 'seed') return ref.s;
    const idx = MATCH_INDEX[ref.m];
    if (ref.t === 'winner') return winnerOf[idx];
    return winnerOf[idx] === redOf[idx] ? blueOf[idx] : redOf[idx];
  }
  function recurse(pos, prob) {
    if (prob <= 0) return;
    if (pos === NUM_MATCHES) {
      const loserM12 = winnerOf[M12_IDX] === redOf[M12_IDX] ? blueOf[M12_IDX] : redOf[M12_IDX];
      const loserM13 = winnerOf[M13_IDX] === redOf[M13_IDX] ? blueOf[M13_IDX] : redOf[M13_IDX];
      if (isReal(loserM12)) value[loserM12] += prob * 7;
      if (isReal(loserM13)) value[loserM13] += prob * 13;
      const m11w = winnerOf[M11_IDX], m13w = winnerOf[M13_IDX];
      const m11Real = isReal(m11w), m13Real = isReal(m13w);
      if (m11Real && m13Real) {
        const p = winProb(meanArr[m11w], varArr[m11w], meanArr[m13w], varArr[m13w]);
        const pSweepM11 = p * p, p3M11 = 2 * p * p * (1 - p);
        const pSweepM13 = (1 - p) * (1 - p), p3M13 = 2 * (1 - p) * (1 - p) * p;
        value[m11w] += prob * ((pSweepM11 + p3M11) * 30 + pSweepM13 * 20 + p3M13 * 25);
        value[m13w] += prob * ((pSweepM13 + p3M13) * 30 + pSweepM11 * 20 + p3M11 * 25);
      } else if (m11Real) {
        value[m11w] += prob * 30; // finals bye: real finalist auto-wins, full 1st-place points
      } else if (m13Real) {
        value[m13w] += prob * 30;
      }
      return;
    }
    const match = BRACKET_MATCHES[pos];
    const red = resolve(match.red), blue = resolve(match.blue);
    redOf[pos] = red; blueOf[pos] = blue;
    const redReal = isReal(red), blueReal = isReal(blue);
    if (redReal && !blueReal) { winnerOf[pos] = red; recurse(pos + 1, prob); return; }
    if (!redReal && blueReal) { winnerOf[pos] = blue; recurse(pos + 1, prob); return; }
    if (!redReal && !blueReal) { winnerOf[pos] = red; recurse(pos + 1, prob); return; }
    const pRed = winProb(meanArr[red], varArr[red], meanArr[blue], varArr[blue]);
    winnerOf[pos] = red;  recurse(pos + 1, prob * pRed);
    winnerOf[pos] = blue; recurse(pos + 1, prob * (1 - pRed));
  }
  recurse(0, 1.0);
  return value;
}

const TEAMS_PER_ALLIANCE = 3;
const OFFER_BRANCH = 3;

function buildSolver(teams, numAlliances) {
  const MEMO_CAP = 30000; // recalibrated after real-device trial: phone crashed (OOM reload) around depth.width 10.4.5 with caps disabled; restored below the original 40000 with extra margin
  const NODE_CAP = 20000; // reduced further this session: the ephemeral fallback's real per-node cost (Set copies, availability scans, not just branching) turned out much higher than expected, so a smaller frozen frontier is needed to keep post-freeze rounds fast on mobile
  // Ephemeral search (used once frozen) is real branching with NO
  // memoization or reuse - its cost per call is roughly width^(2*plies)
  // (offer levels branch by width, acceptDecline levels branch by 2,
  // alternating). Without a hard ceiling on how many plies it's allowed to
  // search, that cost grows without bound as the global search depth keeps
  // climbing round after round - this (not the tree itself) is what
  // crashed the phone at depth.width 11.4.0, since freezing only stopped
  // the PERSISTENT tree from growing, not the per-call cost of refining
  // each frozen frontier node. Keep this small - it only needs to beat the
  // previous 1-ply greedy rollout, not replicate full-depth search.
  const MAX_EPHEMERAL_DEPTH = 2;
  teams = teams.slice();
  const byId = new Map(teams.map(t => [t.id, t]));
  const rankOrder = teams.slice().sort((a, b) => a.qualRank - b.qualRank); // captain order = qual rank, NOT mean power
  const trueLeafMemo = new Map();
  const widthByLevel = new Map(); // depthFromRoot -> target branching width, default OFFER_BRANCH
  // Per-level generation counters for frozen-mode staleness checks. A
  // single GLOBAL counter (tried first) meant any widen event ANYWHERE
  // invalidated EVERY frontier node's cached value at once, causing
  // constant churn - EV never settled because something was always being
  // recomputed somewhere. Scoping invalidation to only the levels within a
  // node's own lookahead window (windowGenSum below) means a node stays
  // stable once ITS relevant levels stop changing, even while widening
  // continues elsewhere in the tree.
  const widthGenByLevel = new Map();
  function windowGenSum(depthFromRoot) {
    let sum = 0;
    for (let lvl = depthFromRoot; lvl <= depthFromRoot + MAX_EPHEMERAL_DEPTH; lvl++) sum += widthGenByLevel.get(lvl) || 0;
    return sum;
  }

  function rosterKey(r) { return r[0] + ':' + r.slice(1).slice().sort().join(','); }
  function fullSignature(rosters) { return rosters.map(rosterKey).join('|'); }
  function isComplete(rosters) { return rosters.length === numAlliances && rosters.every(r => r.length === TEAMS_PER_ALLIANCE); }

  function getActiveAllianceIdx(rosters) {
    const k = rosters.length;
    if (k < numAlliances) return k - 1;
    if (rosters[numAlliances - 1].length < 2) return numAlliances - 1;
    for (let i = numAlliances - 1; i >= 0; i--) if (rosters[i].length < TEAMS_PER_ALLIANCE) return i;
    return -1;
  }
  function getAvailable(rosters, blacklist) {
    const rostered = new Set(rosters.flat());
    const out = [];
    for (const t of teams) { if (rostered.has(t.id) || blacklist.has(t.id)) continue; out.push(t); }
    out.sort((a, b) => b.mean - a.mean);
    return out;
  }
  function nextCaptainCandidate(rosters) {
    const rostered = new Set(rosters.flat());
    for (const t of rankOrder) if (!rostered.has(t.id)) return t;
    return null;
  }
  function applyAccept(rosters, allianceIdx, teamId) {
    const wasFirstPick = rosters[allianceIdx].length === 1;
    const newRosters = rosters.map((r, i) => i === allianceIdx ? [...r, teamId] : r);
    if (wasFirstPick && newRosters.length < numAlliances) {
      const nextCap = nextCaptainCandidate(newRosters);
      if (nextCap) newRosters.push([nextCap.id]);
    }
    return newRosters;
  }

  // Once frozen, EVERY existing frontier node becomes eligible for its
  // first full ephemeral upgrade in the SAME round (since the global
  // search depth crosses their depthFromRoot roughly all at once) - doing
  // the whole backlog synchronously in one round is exactly what produced
  // 60+ second single rounds in testing. This caps how many full upgrades
  // happen per round; the rest get a cheap 1-ply rollout fallback
  // immediately (never leaving a node without SOME value) and their
  // expensive upgrade waits for a future round - spreading the backlog out
  // instead of doing it all at once.
  const EPHEMERAL_BATCH_PER_ROUND = 100;
  // Separate, guaranteed budget for widenRealNodeIfNeeded (catching up an
  // already-real node's width toward its target). ensureDepth's traversal
  // is post-order (children fully processed before their parent), so the
  // numerous frontier-node ephemeral refreshes happen FIRST every round -
  // sharing one counter meant they could consume the entire round's
  // budget before ever reaching the specific real nodes the priority
  // system (smallest-width-first) actually cares about, silently starving
  // widening progress for potentially thousands of rounds even while
  // background work kept happening elsewhere. A separate counter
  // guarantees priority-directed widening always gets its own turn.
  const WIDEN_NODE_BATCH_PER_ROUND = 100;
  const stats = { realNodes: 0, rollouts: 0, leafMemoHits: 0, leafEvals: 0, inherited: 0, frozen: false, widenEvents: 0, ephemeralNodes: 0, ephemeralBatchUsed: 0, widenNodeBatchUsed: 0 };

  function evaluateLeaf(rosters) {
    const key = fullSignature(rosters);
    const cached = trueLeafMemo.get(key);
    if (cached) { stats.leafMemoHits++; return cached; }
    stats.leafEvals++;
    const meanArr = new Array(8).fill(0), varArr = new Array(8).fill(0);
    for (let i = 0; i < rosters.length; i++) {
      let m = 0, v = 0;
      for (const tid of rosters[i]) { const t = byId.get(tid); m += t.mean; v += t.variance; }
      meanArr[i] = m; varArr[i] = v;
    }
    const allianceVals = bracketEV(meanArr, varArr, numAlliances);
    const vec = {};
    for (let i = 0; i < rosters.length; i++) {
      const allianceNumber = i + 1, capFirstPts = 17 - allianceNumber, secondPts = allianceNumber;
      const roster = rosters[i];
      if (roster[0] != null) vec[roster[0]] = allianceVals[i] + capFirstPts;
      if (roster[1] != null) vec[roster[1]] = allianceVals[i] + capFirstPts;
      if (roster[2] != null) vec[roster[2]] = allianceVals[i] + secondPts;
    }
    for (const t of teams) if (!(t.id in vec)) vec[t.id] = 0;
    // Once the leaf-memo cap is hit, simply stop CACHING further leaves -
    // don't force the whole search to stop. This just means some leaf
    // evaluations that would've been cache hits get recomputed from
    // scratch instead (bracketEV is a cheap-ish DP, not free, so this costs
    // real time) - but memory for the memo map itself stays flat forever.
    if (trueLeafMemo.size < MEMO_CAP) trueLeafMemo.set(key, vec);
    return vec;
  }

  function rollout(rosters, blacklist) {
    let r = rosters, guard = 0;
    while (!isComplete(r)) {
      if (++guard > 200) throw new Error('rollout did not terminate');
      const capIdx = getActiveAllianceIdx(r);
      const avail = getAvailable(r, blacklist);
      if (avail.length === 0) break;
      r = applyAccept(r, capIdx, avail[0].id);
    }
    stats.rollouts++;
    return evaluateLeaf(r);
  }

  function makeNode(rosters, blacklist, pendingOffer, depthFromRoot) {
    return {
      rosters, blacklist, pendingOffer, depthFromRoot: depthFromRoot || 0,
      kind: pendingOffer ? 'acceptDecline' : (isComplete(rosters) ? 'leaf' : 'offer'),
      children: null, value: null, isFrontier: false, childDepthBudget: 0, capTeamId: null,
      ephemeralBudgetUsed: -1,
    };
  }

  // Once the persistent tree hits NODE_CAP, we stop creating new REAL
  // (retained) nodes - stats.realNodes is frozen at that point forever.
  // But that doesn't mean the search has to stop: any node that would have
  // become a new real node instead gets its value refined by a fully
  // real-branching search that is NEVER attached to the persistent tree -
  // just plain recursive function calls, whose stack frames (and every
  // object they touch) are eligible for GC the moment the call returns.
  // This is classic time/space-tradeoff iterative-deepening: no
  // memoization or retained structure beyond this one call, so depth can
  // keep climbing forever with flat memory, at the cost of redoing shallow
  // work from scratch every round instead of reusing it like the
  // persistent tree does. Leaf evaluations still benefit from trueLeafMemo
  // (until IT also caps out, per evaluateLeaf above).
  function ephemeralValue(rosters, blacklist, pendingOffer, depthBudget, depthFromRoot) {
    stats.ephemeralNodes++;
    if (pendingOffer) {
      const { allianceIdx, teamId } = pendingOffer;
      const acceptRosters = applyAccept(rosters, allianceIdx, teamId);
      const acceptVal = isComplete(acceptRosters) ? evaluateLeaf(acceptRosters)
        : (depthBudget === 0 ? rollout(acceptRosters, blacklist) : ephemeralValue(acceptRosters, blacklist, null, depthBudget - 1, depthFromRoot + 1));
      const captainSlotsRemaining = numAlliances - rosters.length;
      if (captainSlotsRemaining <= 0) return acceptVal;
      const declineBlacklist = new Set(blacklist); declineBlacklist.add(teamId);
      const declineVal = depthBudget === 0 ? rollout(rosters, declineBlacklist) : ephemeralValue(rosters, declineBlacklist, null, depthBudget - 1, depthFromRoot + 1);
      if ((declineVal[teamId] || 0) > (acceptVal[teamId] || 0)) {
        const out = {};
        for (const k in declineVal) out[k] = 0.99 * declineVal[k];
        for (const k in acceptVal) out[k] = (out[k] || 0) + 0.01 * acceptVal[k];
        return out;
      }
      return acceptVal;
    }
    if (isComplete(rosters)) return evaluateLeaf(rosters);
    if (depthBudget === 0) return rollout(rosters, blacklist);
    const capIdx = getActiveAllianceIdx(rosters);
    const capTeamId = rosters[capIdx][0];
    const width = widthByLevel.get(depthFromRoot) || OFFER_BRANCH;
    const candidates = getAvailable(rosters, blacklist).slice(0, width);
    if (candidates.length === 0) return evaluateLeaf(rosters);
    let bestVal = -Infinity, bestVec = null;
    for (const cand of candidates) {
      const v = ephemeralValue(rosters, blacklist, { allianceIdx: capIdx, teamId: cand.id }, depthBudget - 1, depthFromRoot + 1);
      const score = v[capTeamId] || 0;
      if (score > bestVal) { bestVal = score; bestVec = v; }
    }
    return bestVec;
  }

  function mergeOfferNode(node) {
    let bestVal = -Infinity, bestVec = null;
    for (const child of node.children) {
      if (!child) continue;
      const v = child.value[node.capTeamId] || 0;
      if (v > bestVal) { bestVal = v; bestVec = child.value; }
    }
    node.value = bestVec;
  }

  // Once frozen, a real offer node's persisted children array stops
  // growing (that permanent growth was the actual memory leak) - but its
  // answer can still improve as widthByLevel keeps increasing for its
  // level: for each candidate beyond what's already in node.children, try
  // it via a ONE-TIME throwaway ephemeral search, fold it into node.value
  // if it beats the current best, and keep nothing about it afterward
  // except its id (so we don't try the same candidate twice) - exactly
  // the "compute a sibling, compare, discard" approach, just applied to
  // widening instead of only to depth.
  function widenRealNodeIfNeeded(node) {
    if (node.widenExhausted) return;
    const targetWidth = widthByLevel.get(node.depthFromRoot) || OFFER_BRANCH;
    if (!node.ephemeralTriedIds) node.ephemeralTriedIds = new Set(node.children.filter(c => c).map(c => c.pendingOffer.teamId));
    if (node.ephemeralTriedIds.size >= targetWidth) return;
    if (stats.widenNodeBatchUsed >= WIDEN_NODE_BATCH_PER_ROUND) return; // defer to a future round
    const avail = getAvailable(node.rosters, node.blacklist).filter(t => !node.ephemeralTriedIds.has(t.id));
    if (avail.length === 0) { node.widenExhausted = true; return; }
    const need = targetWidth - node.ephemeralTriedIds.size;
    for (let i = 0; i < need && i < avail.length; i++) {
      const cand = avail[i];
      stats.widenNodeBatchUsed++;
      const v = ephemeralValue(node.rosters, node.blacklist, { allianceIdx: getActiveAllianceIdx(node.rosters), teamId: cand.id }, MAX_EPHEMERAL_DEPTH, node.depthFromRoot + 1);
      node.ephemeralTriedIds.add(cand.id);
      if ((v[node.capTeamId] || 0) > (node.value[node.capTeamId] || 0)) node.value = v;
      if (stats.widenNodeBatchUsed >= WIDEN_NODE_BATCH_PER_ROUND) break;
    }
  }

  function ensureDepth(node, depthBudget) {
    if (node.kind === 'leaf') {
      if (node.value === null) node.value = evaluateLeaf(node.rosters);
      node.isFrontier = false;
      return;
    }
    if (depthBudget === 0) {
      if (node.value !== null) return;
      let startRosters = node.rosters;
      if (node.kind === 'acceptDecline') startRosters = applyAccept(node.rosters, node.pendingOffer.allianceIdx, node.pendingOffer.teamId);
      node.value = rollout(startRosters, node.blacklist);
      node.isFrontier = true;
      return;
    }
    const wasFrontier = node.isFrontier;
    if (node.children === null) {
      if (stats.frozen) {
        // Once frozen, don't gate on depth alone forever - widening can
        // still change this node's answer (more candidates become
        // available at some level within its lookahead window), so the
        // "already stable" check is scoped to only the levels THIS node's
        // ephemeral search actually touches (windowGenSum), not any widen
        // event anywhere in the whole tree.
        const currentGen = windowGenSum(node.depthFromRoot);
        if (node.value !== null && node.ephemeralGenSnapshot === currentGen) {
          node.isFrontier = true;
          return; // nothing relevant has changed since we last computed this
        }
        if (node.value === null) {
          // Guarantee SOME value immediately via a cheap 1-ply rollout, so
          // parent aggregation (mergeOfferNode etc.) never sees a null
          // child - mirrors the plain depthBudget===0 fallback above. The
          // expensive multi-ply upgrade below may still be rate-limited.
          let startRosters = node.rosters;
          if (node.kind === 'acceptDecline') startRosters = applyAccept(node.rosters, node.pendingOffer.allianceIdx, node.pendingOffer.teamId);
          node.value = rollout(startRosters, node.blacklist);
        }
        if (stats.ephemeralBatchUsed >= EPHEMERAL_BATCH_PER_ROUND) {
          node.isFrontier = true;
          return; // this node's expensive upgrade waits for a future round
        }
        stats.ephemeralBatchUsed++;
        // Tree growth is capped - refine this frontier node's value with a
        // throwaway real-branching search instead of persisting more nodes.
        // Always compute at the FULL cap immediately (not
        // Math.min(depthBudget, MAX_EPHEMERAL_DEPTH)) so a given
        // computation reflects the CURRENT width settings right away -
        // ephemeralValue reads widthByLevel live, so widening is
        // automatically picked up here without any extra plumbing.
        node.value = ephemeralValue(node.rosters, node.blacklist, node.pendingOffer, MAX_EPHEMERAL_DEPTH, node.depthFromRoot);
        node.ephemeralGenSnapshot = currentGen;
        node.isFrontier = true;
        return;
      }
      stats.realNodes++;
      if (stats.realNodes >= NODE_CAP) stats.frozen = true;
      if (node.kind === 'offer') {
        const capIdx = getActiveAllianceIdx(node.rosters);
        const capTeamId = node.rosters[capIdx][0];
        node.capTeamId = capTeamId;
        const width = widthByLevel.get(node.depthFromRoot) || OFFER_BRANCH;
        const candidates = getAvailable(node.rosters, node.blacklist).slice(0, width);
        if (candidates.length === 0) {
          node.kind = 'leaf'; node.value = evaluateLeaf(node.rosters); node.isFrontier = false; return;
        }
        node.children = [];
        node.childDepthBudget = depthBudget - 1;
        for (let i = 0; i < candidates.length; i++) {
          const cand = candidates[i];
          const child = makeNode(node.rosters, node.blacklist, { allianceIdx: capIdx, teamId: cand.id }, node.depthFromRoot + 1);
          if (i === 0 && wasFrontier) { child.value = node.value; child.isFrontier = true; stats.inherited++; }
          ensureDepth(child, depthBudget - 1);
          node.children.push(child);
        }
      } else {
        const { allianceIdx, teamId } = node.pendingOffer;
        node.allianceIdx = allianceIdx; node.teamId = teamId;
        const acceptRosters = applyAccept(node.rosters, allianceIdx, teamId);
        const acceptChild = makeNode(acceptRosters, node.blacklist, null, node.depthFromRoot + 1);
        if (wasFrontier) { acceptChild.value = node.value; acceptChild.isFrontier = true; stats.inherited++; }
        ensureDepth(acceptChild, depthBudget - 1);
        const captainSlotsRemaining = numAlliances - node.rosters.length;
        let declineChild = null;
        if (captainSlotsRemaining > 0) {
          const declineBlacklist = new Set(node.blacklist); declineBlacklist.add(teamId);
          declineChild = makeNode(node.rosters, declineBlacklist, null, node.depthFromRoot + 1);
          ensureDepth(declineChild, depthBudget - 1);
        }
        node.children = [acceptChild, declineChild];
      }
      node.isFrontier = false;
    } else {
      if (node.kind === 'offer') {
        node.childDepthBudget = depthBudget - 1;
        for (const child of node.children) { if (child === null) continue; ensureDepth(child, depthBudget - 1); }
      } else {
        for (const child of node.children) if (child) ensureDepth(child, depthBudget - 1);
      }
    }
    if (node.kind === 'offer') {
      mergeOfferNode(node);
      if (stats.frozen) widenRealNodeIfNeeded(node);
    }
    else {
      const [acceptChild, declineChild] = node.children;
      if (!declineChild) { node.value = acceptChild.value; }
      else {
        const teamId = node.teamId;
        const acceptVal = acceptChild.value, declineVal = declineChild.value;
        if ((declineVal[teamId] || 0) > (acceptVal[teamId] || 0)) {
          const out = {};
          for (const k in declineVal) out[k] = 0.99 * declineVal[k];
          for (const k in acceptVal) out[k] = (out[k] || 0) + 0.01 * acceptVal[k];
          node.value = out;
        } else { node.value = acceptVal; }
      }
    }
  }

  // Finds every depthFromRoot where a real (children !== null) offer node
  // currently exists, mapped to the ACTUAL smallest children.length seen
  // there - not the widthByLevel target, since availability limits can
  // make a level's real width fall short of its target (common near the
  // end of the draft, where few candidates remain). Using the MINIMUM
  // (not max) across nodes at that depth matters: different branches at
  // the same depth can have different actual widths depending on
  // path-specific availability, and a wider sibling shouldn't hide a
  // still-starved node elsewhere at that same depth.
  function collectRealOfferLevels(node, out) {
    out = out || new Map();
    if (!node || node.kind === 'leaf') return out;
    if (node.kind === 'offer' && node.children !== null && !node.widenExhausted) {
      // Once frozen, node.children stops growing (see widenRealNodeIfNeeded)
      // - ephemeralTriedIds tracks the TRUE considered width instead.
      // Nodes marked widenExhausted (genuinely nothing left to try, ever)
      // are excluded here on purpose - counting them would let one
      // permanently-limited node (its own roster/blacklist just leaves it
      // few candidates) pin the WHOLE level as "smallest" forever, since
      // its ceiling can never rise - that starves every node at the level
      // that still has real room, since priority always targets the
      // reported smallest.
      const w = node.ephemeralTriedIds ? node.ephemeralTriedIds.size : node.children.length;
      const prev = out.get(node.depthFromRoot);
      if (prev === undefined || w < prev) out.set(node.depthFromRoot, w);
    }
    if (node.children) for (const child of node.children) collectRealOfferLevels(child, out);
    return out;
  }

  // Widens all real offer nodes at exactly targetLevel to widthByLevel.get(targetLevel)
  // (set by the caller before this runs) - adds new candidate children beyond
  // whatever's already there, ensureDepth'd to match existing siblings' depth.
  function widenAtLevel(node, targetLevel) {
    if (!node || node.kind === 'leaf') return;
    if (node.depthFromRoot === targetLevel) {
      if (node.kind === 'offer' && node.children !== null) {
        const newWidth = widthByLevel.get(targetLevel) || OFFER_BRANCH;
        if (stats.frozen) {
          // Don't grow this node's persisted children (that was the actual
          // memory leak) - just record the new target, but only if there's
          // genuinely at least one more available candidate to try; otherwise
          // this node is already maxed out and counting it as progress would
          // let the search spin forever, never detecting true exhaustion.
          const consideredCount = node.ephemeralTriedIds ? node.ephemeralTriedIds.size : node.children.length;
          if (consideredCount >= newWidth) return;
          const alreadyTried = node.ephemeralTriedIds || new Set(node.children.filter(c => c).map(c => c.pendingOffer.teamId));
          const hasMore = getAvailable(node.rosters, node.blacklist).some(t => !alreadyTried.has(t.id));
          if (!hasMore) { node.widenExhausted = true; return; }
          // widenRealNodeIfNeeded (called from ensureDepth) tries the
          // additional candidates one at a time and discards each after
          // comparing, next time this node is visited - already
          // rate-limited via EPHEMERAL_BATCH_PER_ROUND.
          widthByLevel.set(targetLevel, newWidth);
          widthGenByLevel.set(targetLevel, (widthGenByLevel.get(targetLevel) || 0) + 1);
          stats.widenEvents++;
          return;
        }
        if (node.children.length < newWidth) {
          const already = new Set(node.children.filter(c => c).map(c => c.pendingOffer.teamId));
          const avail = getAvailable(node.rosters, node.blacklist).filter(c => !already.has(c.id));
          const need = newWidth - node.children.length;
          for (let i = 0; i < need && i < avail.length; i++) {
            const cand = avail[i];
            const child = makeNode(node.rosters, node.blacklist, { allianceIdx: getActiveAllianceIdx(node.rosters), teamId: cand.id }, node.depthFromRoot + 1);
            ensureDepth(child, node.childDepthBudget);
            node.children.push(child);
            stats.widenEvents++;
          }
          mergeOfferNode(node);
        }
      }
      return; // deeper nodes are beyond targetLevel - not relevant to this pass
    }
    if (node.depthFromRoot < targetLevel && node.children) {
      for (const child of node.children) widenAtLevel(child, targetLevel);
    }
  }

  return { rankOrder, teams, stats, ensureDepth, makeNode, widthByLevel, collectRealOfferLevels, widenAtLevel };
}

// A node still needs real expansion if it's a non-leaf with no children yet
// (either untouched, or resolved only via a rollout stand-in) - counts how
// many such nodes remain anywhere in the tree, recursively.
function countFrontier(node) {
  if (!node || node.kind === 'leaf') return 0;
  if (node.children === null) return 1;
  let count = 0;
  for (const child of node.children) count += countFrontier(child);
  return count;
}

// ---- worker entry point ----
// Generalized: caller supplies the exact starting node (rosters, blacklist,
// pendingOffer) and which team's EV to track - works for ANY decision point
// in the draft, not just captain 1's opening pick.
self.onmessage = function(e) {
  const { teams, rosters, blacklist, pendingOffer, myTeamId, numAlliances } = e.data;
  const solver = buildSolver(teams, numAlliances);
  const node = solver.makeNode(rosters, new Set(blacklist), pendingOffer || null, 0);
  const t0 = Date.now();

  const EPS = 1e-9;
  let depth = 1;
  let mode = 'deepen';
  let evHistory = [];
  let widenProcessedThisPass = null; // Set of offer-levels already widened this pass
  let widenEventsAtSweepStart = 0;
  let widenCycles = 0; // how many times we've entered widen mode - first cycle needs 4 plateaued rounds, every cycle after needs only 3
  let lastPostTime = 0;
  // Picks which level to widen next within the current pass: the level
  // with the SMALLEST actual current width (the one captains are seeing
  // the fewest real options at) among levels not yet touched this pass,
  // ties broken by the DEEPEST such level. Actual width (not the
  // widthByLevel target) is what matters, since a level can already be
  // short of its target purely from running out of available candidates -
  // re-measured fresh every round (not just once per pass) so newly
  // appeared offer levels (a side effect of widening adding deeper real
  // branches) are naturally picked up instead of missed by a stale list.
  function pickNextWidenLevel() {
    const levels = solver.collectRealOfferLevels(node);
    let best = null, bestWidth = Infinity;
    for (const [lvl, w] of levels) {
      if (widenProcessedThisPass.has(lvl)) continue;
      if (w < bestWidth || (w === bestWidth && lvl > best)) { bestWidth = w; best = lvl; }
    }
    return { level: best, width: best === null ? null : levels.get(best) };
  }
  // Once frontierCount genuinely hits 0, depth has reached its TRUE
  // structural maximum for this query - there is no more real depth to
  // explore, ever, regardless of what happens afterward. Without this flag,
  // a later widen sweep that happens to succeed (very likely once there's a
  // large team pool with room to keep adding candidates) would still bump
  // depth on pure bookkeeping, even though nothing new was actually explored
  // in the depth dimension - across many such successful sweeps (3->4->5->
  // 6->7->...), depth could inflate well past the tree's real bottom. Once
  // this flag is set, depth is frozen for good; only width keeps moving.
  let depthIsFinal = false;

  function plateaued() {
    const threshold = widenCycles === 0 ? 3 : 2;
    if (evHistory.length < threshold) return false;
    const last = evHistory.slice(-threshold);
    return (Math.max(...last) - Math.min(...last)) < EPS;
  }
  // Is declining trivial (guaranteed worthless) for `teamId` given the
  // CURRENT roster state? Two ways this can be true:
  //  (a) C===0: all 8 captains already locked in - no captaincy path exists
  //      at all anymore, for anyone.
  //  (b) H >= C+P: even in the most optimistic case - every one of the H
  //      currently-unaffiliated teams ranked higher than this team gets
  //      absorbed as a PICK (not captain) as early as structurally possible
  //      - there still aren't enough remaining ROUND-1 pick opportunities
  //      (P) to clear a path to one of the C remaining captain slots. ONLY
  //      round-1 picks count here: round-2 doesn't start until ALL 8
  //      captains are already locked in, so a round-2 slot happens strictly
  //      AFTER captaincy is already decided and can never help resolve it -
  //      counting them (an earlier draft of this formula did) wrongly
  //      overstated how much "absorption capacity" exists. P here is: each
  //      currently-existing captain who hasn't made their round-1 pick yet,
  //      plus each of the C future captains' own eventual round-1 pick.
  //  If H < C+P, there EXISTS at least one (however contrived) sequence of
  //  offers/accepts that clears a captaincy path for this team - not
  //  trivial, however unlikely in practice.
  function computeDeclineTrivial(rosters, teamId) {
    const C = numAlliances - rosters.length;
    if (C === 0) return true;
    const rostered = new Set(rosters.flat());
    const myRankIdx = solver.rankOrder.findIndex(t => t.id === teamId);
    let H = 0;
    for (let i = 0; i < myRankIdx; i++) if (!rostered.has(solver.rankOrder[i].id)) H++;
    let existingCaptainsNeedingFirstPick = 0;
    for (const r of rosters) if (r.length === 1) existingCaptainsNeedingFirstPick++;
    const P = existingCaptainsNeedingFirstPick + C;
    return H >= C + P;
  }
  function computeBreakdown() {
    if (!(node.kind === 'acceptDecline' && node.children)) return null;
    const [acceptChild, declineChild] = node.children;
    const candId = node.pendingOffer.teamId;
    const declineTrivial = computeDeclineTrivial(node.rosters, candId);
    return {
      myEvIfAccept: acceptChild ? (acceptChild.value[myTeamId] || 0) : null,
      myEvIfDecline: declineChild ? (declineChild.value[myTeamId] || 0) : null,
      candidateEvIfAccept: acceptChild ? (acceptChild.value[candId] || 0) : null,
      candidateEvIfDecline: declineChild ? (declineChild.value[candId] || 0) : null,
      declineTrivial,
    };
  }
  // "depth.width" status: depth as usual, plus the average branching width
  // actually used across every level explored so far (default OFFER_BRANCH
  // for any level never widened). E.g. 9 levels at width 3 + 1 level at
  // width 4 -> "10.3.1" (avg = (9*3+4)/10 = 3.1).
  function computeStatus() {
    let sum = 0;
    for (let lvl = 0; lvl < depth; lvl++) sum += solver.widthByLevel.get(lvl) || OFFER_BRANCH;
    const avgWidth = depth > 0 ? sum / depth : OFFER_BRANCH;
    return `${depth}.${avgWidth.toFixed(1)}`;
  }
  function postDone(reason) {
    self.postMessage({
      type: 'done', reason, depth,
      status: computeStatus(),
      ev: node.value[myTeamId] || 0,
      breakdown: computeBreakdown(),
      frontierCount: countFrontier(node),
      stats: Object.assign({}, solver.stats),
    });
  }

  while (true) {
    const roundStart = Date.now();
    solver.stats.ephemeralBatchUsed = 0; // fresh batch allowance each round - see EPHEMERAL_BATCH_PER_ROUND
    solver.stats.widenNodeBatchUsed = 0; // separate fresh allowance for priority-directed widening - see WIDEN_NODE_BATCH_PER_ROUND
    let widenLevelThisRound = null;
    if (mode === 'deepen') {
      solver.ensureDepth(node, depth);
    } else {
      const picked = pickNextWidenLevel();
      widenLevelThisRound = picked.level;
      const newWidth = picked.width + 1;
      solver.widthByLevel.set(widenLevelThisRound, newWidth);
      solver.widenAtLevel(node, widenLevelThisRound);
    }
    const roundMs = Date.now() - roundStart;
    const cumMs = Date.now() - t0;
    const frontierCount = countFrontier(node);
    const ev = node.value[myTeamId] || 0;

    // Throttle: post at most ~10 progress updates/sec. When rounds resolve
    // near-instantly (a nearly-finished draft), reporting every single one
    // would flood the main thread's message queue faster than the browser
    // can render or handle taps - this keeps the UI responsive regardless of
    // how fast the underlying computation runs. NOTE: this can silently drop
    // every intermediate update when the whole search finishes inside one
    // throttle window (very common near the end of the draft, where trees
    // are small) - postDone() below guards against that by always including
    // the TRUE final state in the done message itself, so the display never
    // freezes on a stale early snapshot even if every progress update in
    // between got throttled away.
    const nowTime = Date.now();
    if (nowTime - lastPostTime > 100) {
      lastPostTime = nowTime;
      self.postMessage({
        type: 'progress', depth, roundMs, cumMs, ev,
        status: computeStatus(),
        breakdown: computeBreakdown(),
        frontierCount,
        stats: Object.assign({}, solver.stats),
      });
    }

    if (node.kind === 'leaf' && depth >= 1) { postDone('exact'); return; }

    if (mode === 'deepen') {
      evHistory.push(ev);
      // Real convergence (frontierCount===0) no longer stops the search -
      // it just means there's nothing left to DEEPEN, but width can always
      // keep increasing, so treat it exactly like a plateau: start widening.
      if (frontierCount === 0 || solver.stats.frozen) depthIsFinal = true; // permanent - depth never moves again after this
      if (frontierCount === 0 || solver.stats.frozen || plateaued()) {
        const levels = solver.collectRealOfferLevels(node);
        if (levels.size === 0) {
          if (frontierCount === 0 || solver.stats.frozen) {
            // Genuinely nothing left in either direction: either the whole
            // tree completed (frontierCount===0), or we're frozen and
            // every existing real offer node has been marked exhausted
            // (collectRealOfferLevels excludes those) - once frozen, no
            // new real offer levels can ever appear either, so this is
            // true completion, not a reason to keep bumping depth (which
            // has no effect once frozen anyway).
            postDone('exhausted');
            return;
          }
          // No REAL offer node exists YET to widen, but frontierCount > 0
          // means real depth still remains unexplored (some node is still
          // just a rollout stand-in) - a plateau triggered this check
          // prematurely, before depth reached far enough to create a real
          // offer node. Keep deepening instead of wrongly declaring
          // exhaustion - widening only becomes possible once there's an
          // actual offer node to widen.
          depth++;
        } else {
          mode = 'widen';
          widenProcessedThisPass = new Set();
          widenEventsAtSweepStart = solver.stats.widenEvents;
          widenCycles++;
          evHistory = [];
        }
      } else {
        depth++;
      }
    } else {
      widenProcessedThisPass.add(widenLevelThisRound);
      const remaining = pickNextWidenLevel();
      if (remaining.level === null) {
        // Pass complete (every currently-known offer level touched once).
        // Only genuinely nothing left to explore if BOTH directions are
        // exhausted: the pass added no new candidates anywhere AND there's
        // no remaining depth to explore either (frontierCount===0). A
        // plateau can trigger a widen pass well before the tree is
        // actually fully deepened - if that pass adds nothing (the levels
        // explored so far already have their natural max candidates) but
        // frontierCount is still > 0, there is real, unexplored depth
        // beyond what's been reached - resume deepening instead of
        // wrongly declaring total exhaustion.
        const sweepAddedNothing = solver.stats.widenEvents === widenEventsAtSweepStart;
        // Once frozen, widening is permanently a no-op (see widenAtLevel),
        // so a pass adding nothing tells us nothing further can improve -
        // frontierCount alone can never confirm that here, since frozen
        // ephemeral frontier nodes are permanently "frontier" by design and
        // never resolve to 0. Without this, the search would spin forever
        // doing rounds that accomplish nothing once ephemeral depth is
        // capped and widening is frozen.
        if (sweepAddedNothing && (frontierCount === 0 || solver.stats.frozen)) { postDone('exhausted'); return; }
        mode = 'deepen';
        if (!depthIsFinal) depth++; // only advance depth if the tree hasn't ALREADY hit its true bottom - a successful widen pass after that point explored more width, not more depth, so depth must not move
      }
    }
  }
};

// ============================================================
// LSS offense/defense regression + residual-based variance.
// Validated against synthetic ground truth: power recovery correlates
// ~0.95 with true values at realistic match counts; variance recovery
// correlates only ~0.11-0.15 at a single event's typical match count
// (needs ~300+ matches to reach ~0.74) - squared residuals are an
// inherently noisy estimator, unlike raw scores for the mean. Shrinkage
// stabilizes wild individual outliers but does NOT fix this accuracy
// limit - flagged honestly in the UI, not hidden.
// ============================================================
function solveLinearSystem(A, b, n) {
  const M = A.map((row, i) => { const r = new Float64Array(n + 1); r.set(row); r[n] = b[i]; return r; });
  for (let col = 0; col < n; col++) {
    let maxRow = col, maxVal = Math.abs(M[col][col]);
    for (let r = col + 1; r < n; r++) { if (Math.abs(M[r][col]) > maxVal) { maxVal = Math.abs(M[r][col]); maxRow = r; } }
    if (maxRow !== col) { const tmp = M[col]; M[col] = M[maxRow]; M[maxRow] = tmp; }
    if (Math.abs(M[col][col]) < 1e-9) continue;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const factor = M[r][col] / M[col][col];
      if (factor === 0) continue;
      for (let c = col; c <= n; c++) M[r][c] -= factor * M[col][c];
    }
  }
  const x = new Float64Array(n);
  for (let i = 0; i < n; i++) x[i] = Math.abs(M[i][i]) > 1e-9 ? M[i][n] / M[i][i] : 0;
  return x;
}

function buildAndSolveLSS(matches, teamKeys) {
  const teamIndex = new Map(); teamKeys.forEach((tk, i) => teamIndex.set(tk, i));

  const ATb = new Float64Array(numUnknowns);
  const rows = [];
  function addRow(entries, bVal, weight, trackForResiduals) {
    weight = weight || 1;
    for (let a = 0; a < entries.length; a++) {
      ATb[entries[a].idx] += weight * entries[a].val * bVal;
      for (let b = 0; b < entries.length; b++) ATA[entries[a].idx][entries[b].idx] += weight * entries[a].val * entries[b].val;
    }
    if (trackForResiduals) rows.push({ entries, b: bVal });
  }
  for (const m of matches) {
    const redTeams = m.red.filter(tk => teamIndex.has(tk));
    const blueTeams = m.blue.filter(tk => teamIndex.has(tk));
    if (m.redScore == null || m.blueScore == null) continue;
    const redEntries = [];
    for (const tk of redTeams) redEntries.push({ idx: teamIndex.get(tk), val: 1 });
    for (const tk of blueTeams) redEntries.push({ idx: N + teamIndex.get(tk), val: -1 });
    addRow(redEntries, m.redScore, 1, true);
    const blueEntries = [];
    for (const tk of blueTeams) blueEntries.push({ idx: teamIndex.get(tk), val: 1 });
    for (const tk of redTeams) blueEntries.push({ idx: N + teamIndex.get(tk), val: -1 });
    addRow(blueEntries, m.blueScore, 1, true);
  }
  const constraintEntries = [];
  for (let i = 0; i < N; i++) constraintEntries.push({ idx: N + i, val: 1 });
  addRow(constraintEntries, 0, 1000, false); // avg-defense=0 gauge constraint
  const x = solveLinearSystem(ATA, ATb, numUnknowns);
  return { x, rows, N };
}

function computeResidualVariance(rows, x, N, shrinkK) {
  const B = Array.from({ length: N }, () => new Float64Array(N));
  const Bb = new Float64Array(N);
  const matchesPlayed = new Array(N).fill(0);
  for (const row of rows) {
    let predicted = 0;
    for (const e of row.entries) predicted += e.val * x[e.idx];
    const sq = (row.b - predicted) ** 2;
    const teamIdxs = row.entries.map(e => e.idx < N ? e.idx : e.idx - N);
    for (const i of teamIdxs) {
      Bb[i] += sq; matchesPlayed[i]++;
      for (const j of teamIdxs) B[i][j] += 1;
    }
  }
  const vRaw = Array.from(solveLinearSystem(B, Bb, N)).map(v => Math.max(1, v));
  const popMean = vRaw.reduce((a, b) => a + b, 0) / N;
  return vRaw.map((v, i) => {
    const w = matchesPlayed[i] / (matchesPlayed[i] + shrinkK);
    return w * v + (1 - w) * popMean;
  });
}

async function importFromTBA() {
  const apiKey = document.getElementById('tbaKey').value.trim();
  const eventKey = document.getElementById('tbaEvent').value.trim();
  const statusEl = document.getElementById('tbaStatus');
  if (!apiKey) { statusEl.textContent = 'Enter your TBA Read API key first.'; return; }
  if (!eventKey) { statusEl.textContent = 'Enter an event key (e.g. 2026cthar).'; return; }
  statusEl.textContent = 'Fetching from TBA…';
  try {
    const headers = { 'X-TBA-Auth-Key': apiKey };
    const [rankingsRes, matchesRes] = await Promise.all([
      fetch(`https://www.thebluealliance.com/api/v3/event/${eventKey}/rankings`, { headers }),
      fetch(`https://www.thebluealliance.com/api/v3/event/${eventKey}/matches`, { headers }),
    ]);
    if (!rankingsRes.ok) throw new Error('rankings request failed (HTTP ' + rankingsRes.status + ') - check API key and event key');
    if (!matchesRes.ok) throw new Error('matches request failed (HTTP ' + matchesRes.status + ')');
    const rankings = await rankingsRes.json();
    const rawMatches = await matchesRes.json();
    if (!rankings || !rankings.rankings || rankings.rankings.length === 0) {
      throw new Error('No ranking data returned - event may not have posted qual results yet, or the event key is wrong.');
    }
    const qualMatches = rawMatches.filter(m => m.comp_level === 'qm' && m.alliances && m.alliances.red && m.alliances.blue);
    if (qualMatches.length === 0) throw new Error('No completed qualification matches found for this event yet.');

    const teamKeys = rankings.rankings.map(r => r.team_key);
    const matches = qualMatches.map(m => ({
      red: m.alliances.red.team_keys, blue: m.alliances.blue.team_keys,
      redScore: m.alliances.red.score, blueScore: m.alliances.blue.score,
    })).filter(m => m.redScore != null && m.blueScore != null && m.redScore >= 0 && m.blueScore >= 0);

    statusEl.textContent = `Solving LSS regression over ${matches.length} qual matches…`;
    const { x, rows, N } = buildAndSolveLSS(matches, teamKeys);
    const power = teamKeys.map((_, i) => x[i] + x[N + i]);
    const minPower = Math.min(...power);
    const normPower = power.map(p => p - minPower); // worst team = 0
    const variance = computeResidualVariance(rows, x, N, 8);

    teams = rankings.rankings.map((r, i) => ({
      id: r.team_key.replace('frc', ''),
      qualRank: r.rank,
      mean: +normPower[i].toFixed(2),
      variance: +variance[i].toFixed(2),
    }));
    renderTeamTable();
    statusEl.textContent = `Imported ${teams.length} teams from ${matches.length} qual matches at ${eventKey}. `;
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message + ' — possible causes: wrong key/event, event has no posted results yet, or TBA blocked the cross-origin request (CORS) from this page.';
  }
}

// ============================================================
// WALKTHROUGH MODE
// Steps through the actual draft one decision at a time. For decisions
// that aren't the user's team, asks what happened. For the user's own
// decisions, runs the solver (same worker machinery, generalized to an
// arbitrary starting state) and recommends by EV instead of asking.

// -> 6 alliances - while the playoff bracket shape itself never changes
// (non-existent alliances just get byes, handled in mainThreadBracketEV /
// bracketEV). This is computed once per team pool and stored on wt.

function initWalkthroughFromData(teamsData, myTeamId) {

  const rankOrder = teams.slice().sort((a, b) => a.qualRank - b.qualRank);
  wt = {
    rosters: [[rankOrder[0].id]], blacklist: new Set(), pendingOffer: null,
    myTeamId, rankOrder, history: [], activeWorkers: [], snapshots: [],
    numAlliances: computeNumAlliances(teams),
  };
  document.getElementById('wtWhoAmI').textContent = myTeamId === '__ANY__' ? 'Viewing as every team' : `Viewing as ${myTeamId}`;
  renderWalkthrough();
}

document.getElementById('btnResetWalkthrough').onclick = () => {
  if (!wt) return;
  if (wt.activeWorkers) wt.activeWorkers.forEach(w => w.terminate());
  initWalkthroughFromData(teams, wt.myTeamId);
};

document.getElementById('btnUndo').onclick = () => {
  if (!wt || wt.snapshots.length === 0) return;
  if (wt.activeWorkers) wt.activeWorkers.forEach(w => w.terminate());
  const snap = wt.snapshots.pop();
  wt.rosters = snap.rosters; wt.blacklist = snap.blacklist; wt.pendingOffer = snap.pendingOffer;
  wt.history.length = snap.historyLen;
  renderWalkthrough();
};

function renderRosterBoard() {
  const board = document.getElementById('wtRosterBoard');
  const complete = wtIsComplete(wt.rosters);
  let playoffOnly = null;
  if (complete) {
    const teamById = new Map(teams.map(t => [t.id, t]));
    const meanArr = new Array(8).fill(0), varArr = new Array(8).fill(0);
    for (let i = 0; i < wt.rosters.length; i++) {
      let m = 0, v = 0;
      for (const tid of wt.rosters[i]) { const t = teamById.get(tid); m += t.mean; v += t.variance; }
      meanArr[i] = m; varArr[i] = v;
    }
    playoffOnly = mainThreadBracketEV(meanArr, varArr, wt.numAlliances);
    // 'auto auto' (not '1fr auto'): both columns size to their own content,
    // so the EV column sits right after the widest alliance label instead of
    // being stretched to the panel's far edge - EVs still align vertically
    // across all 8 rows since grid computes one shared width per column.
    board.style.gridTemplateColumns = 'auto auto';
    board.style.gridTemplateRows = 'none';
    board.style.gridAutoFlow = 'row';
    board.style.alignItems = 'baseline';
    board.style.rowGap = '4px';
    board.style.columnGap = '14px';
    board.style.justifyContent = 'start';
  } else {
    const rowCount = Math.ceil(wt.numAlliances / 2);
    board.style.gridTemplateColumns = 'repeat(2, 1fr)';
    board.style.gridTemplateRows = `repeat(${rowCount}, auto)`;
    board.style.gridAutoFlow = 'column'; // fills column-major: first-half alliances in col 1, rest in col 2
    board.style.alignItems = '';
    board.style.rowGap = '';
  }
  board.innerHTML = '';
  for (let i = 0; i < wt.rosters.length; i++) {
    const r = wt.rosters[i];
    if (playoffOnly) {
      const label = document.createElement('div');
      label.innerHTML = `<b>#${i + 1}</b>${r.join(', ') || '—'}`;
      const value = document.createElement('div');
      value.style.color = 'var(--accent2)';
      value.style.whiteSpace = 'nowrap';
      value.textContent = `EV ${playoffOnly[i].toFixed(3)}`;
      board.appendChild(label);
      board.appendChild(value);
      continue;
    }
    const div = document.createElement('div');
    div.innerHTML = `<b>#${i + 1}</b>${r.join(', ') || '—'}`;
    board.appendChild(div);
  }
  return playoffOnly;
}
function renderHistory() {
  document.getElementById('wtHistoryLog').innerHTML = wt.history.map(h => `<div>${h}</div>`).join('');
  document.getElementById('btnUndo').disabled = wt.snapshots.length === 0;
}

// Central commit point for every state-changing action - snapshots BEFORE
// the change so Undo can restore exactly (rosters/blacklist/pendingOffer
// plus how much history existed), logs the action, applies the new state,
// and re-renders. Every handler below goes through this - no ad hoc state
// mutation anywhere else, so Undo can never miss a step.
function wtCommit(logMsg, newRosters, newBlacklist, newPendingOffer) {
  wt.snapshots.push({ rosters: wt.rosters, blacklist: wt.blacklist, pendingOffer: wt.pendingOffer, historyLen: wt.history.length });
  wt.history.push(logMsg);
  wt.rosters = newRosters; wt.blacklist = newBlacklist; wt.pendingOffer = newPendingOffer || null;
  renderWalkthrough();
}

// Runs the solver on a specific child state, tracking EV for `forTeamId`,
// calling onUpdate(evValue, depth, done, reason, breakdown) as progress comes in.
function wtRunSolver(rosters, blacklist, pendingOffer, forTeamId, onUpdate) {
  const url = getWorkerBlobUrl();
  const worker = new Worker(url);
  wt.activeWorkers.push(worker);
  worker.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === 'progress') onUpdate(msg.ev, msg.depth, false, null, msg.breakdown, msg.status);
    else if (msg.type === 'done') onUpdate(msg.ev, msg.depth, true, msg.reason, msg.breakdown, msg.status);
  };
  worker.postMessage({
    teams, rosters, blacklist: Array.from(blacklist), pendingOffer,
    myTeamId: forTeamId, numAlliances: wt.numAlliances,
  });
  return worker;
}

function stopWtWorkers() {
  wt.activeWorkers.forEach(w => w.terminate()); wt.activeWorkers = [];
  if (wt.repainter) { wt.repainter.stop(); wt.repainter = null; }
}

// The solver can post progress dozens of times per second while depth/width
// are climbing. Repainting the DOM on every tick was the real cause behind
// taps on candidate cards not registering: the numbers (and therefore the
// card's height/contents) were changing out from under a tap in progress,
// which browsers treat as a reason to cancel the gesture. This decouples the
// two: solver callbacks always update the underlying state immediately
// (nothing is lost or delayed). For the first 0.2s, every update paints
// immediately too (nothing hidden) - useful for seeing the very first real
// numbers land right away. After 0.2s, painting switches to throttled mode:
// only flushes at 1s, 2s, 3s... or when explicitly flushed (a manual tap) -
// so a card's geometry stays put long enough between updates to tap
// reliably, once the initial burst has settled.
function createThrottledPainter(paintFn) {
  let dirty = false;
  let liveMode = true;
  paintFn(); // paint immediately once so the panel isn't blank
  const switchTimer = setTimeout(() => { liveMode = false; }, 200);
  const intervalTimer = setInterval(() => { if (dirty) { dirty = false; paintFn(); } }, 1000);
  return {
    markDirty() {
      if (liveMode) { dirty = false; paintFn(); }
      else dirty = true;
    },
    flushNow() { dirty = false; paintFn(); },
    stop() { clearTimeout(switchTimer); clearInterval(intervalTimer); },
  };
}

function renderWalkthrough() {
  renderRosterBoard();
  renderHistory();
  stopWtWorkers();
  const panel = document.getElementById('wtDecisionPanel');

  if (wtIsComplete(wt.rosters)) {
    panel.innerHTML = `<div class="final-banner show"><b>Alliance Selection Complete. Good Luck!</b></div>`;
    return;
  }

  if (wt.pendingOffer) {
    const { allianceIdx, teamId } = wt.pendingOffer;
    const isMine = wt.myTeamId === '__ANY__' || teamId === wt.myTeamId;
    const captainSlotsRemaining = wt.numAlliances - wt.rosters.length;
    const declineLegal = captainSlotsRemaining > 0; // model's own assumption - user can still override below

    if (!isMine) {
      panel.innerHTML = `
        <div class="decision-header"><b>${teamId}</b>: Accept or Decline?</div>
        <div class="btn-row">
          <button id="wtAccept" class="primary choice-btn">Accept</button>
          <button id="wtDecline" class="choice-btn">Decline</button>
        </div>`;
      document.getElementById('wtAccept').onclick = () => {
        wtCommit(`${teamId} accepted alliance #${allianceIdx + 1}'s offer.`, wtApplyAccept(wt.rosters, allianceIdx, teamId, wt.rankOrder), wt.blacklist, null);
      };
      document.getElementById('wtDecline').onclick = () => {
        const bl = new Set(wt.blacklist); bl.add(teamId);
        wtCommit(`${teamId} declined alliance #${allianceIdx + 1}'s offer.`, wt.rosters, bl, null);
      };
    } else {
      const headerText = wt.myTeamId === '__ANY__'
        ? `<b>${teamId}</b>: Accept or Decline?`
        : `It's your call: accept alliance #${allianceIdx + 1}'s offer, or decline?`;
      panel.innerHTML = `<div class="decision-header">${headerText}</div><div id="wtRecommendWrap"></div>`;
      const wrap = document.getElementById('wtRecommendWrap');
      const acceptState = { ev: null, status: '', reason: null };
      const declineState = { ev: null, status: '', reason: null };
      function statusText(s) { return s.reason === 'memory' ? 'memory' : s.status; }
      function paint() {
        const declineWins = declineState.ev != null && acceptState.ev != null && declineState.ev > acceptState.ev;
        wrap.innerHTML = `
          <div class="cand-row">
            <button type="button" class="cand-box cand-box-btn ${!declineWins ? 'leading' : ''}" data-choice="accept">
              <span class="cb-ev">${acceptState.ev != null ? acceptState.ev.toFixed(3) : '…'}</span>
              <div class="cb-status">Accept (${statusText(acceptState)})</div>
            </button>
          </div>
          <div class="cand-row">
            <button type="button" class="cand-box cand-box-btn ${declineWins ? 'leading' : ''}" data-choice="decline">
              <span class="cb-ev">${declineState.ev != null ? declineState.ev.toFixed(3) : '…'}</span>
              <div class="cb-status">Decline (${statusText(declineState)})</div>
            </button>
          </div>`;
      }
      wrap.onclick = (e) => {
        const btn = e.target.closest('[data-choice]');
        if (!btn) return;
        if (btn.dataset.choice === 'accept') {
          wtCommit(`${teamId} accepted alliance #${allianceIdx + 1}'s offer (EV ${acceptState.ev != null ? acceptState.ev.toFixed(3) : '?'}).`, wtApplyAccept(wt.rosters, allianceIdx, teamId, wt.rankOrder), wt.blacklist, null);
        } else {
          const bl = new Set(wt.blacklist); bl.add(teamId);
          wtCommit(`${teamId} declined alliance #${allianceIdx + 1}'s offer (EV ${declineState.ev != null ? declineState.ev.toFixed(3) : '?'}).`, wt.rosters, bl, null);
        }
      };
      wt.repainter = createThrottledPainter(paint);
      // Alliance 1 is always the last to complete its roster (round 2 runs in
      // reverse, 8 down to 1) - so its second pick always leads straight to a
      // finished draft. No search needed: just evaluate the resulting leaf.
      const isAlliance1FinalPick = (allianceIdx === 0 && wt.rosters[0].length === 2);
      if (isAlliance1FinalPick) {
        const finalRosters = wtApplyAccept(wt.rosters, allianceIdx, teamId, wt.rankOrder);
        const vec = mtEvaluateLeaf(finalRosters, teams);
        acceptState.ev = vec[teamId] || 0; acceptState.status = 'trivial'; acceptState.reason = 'exact';
        wt.repainter.markDirty();
      } else {
        wtRunSolver(wtApplyAccept(wt.rosters, allianceIdx, teamId, wt.rankOrder), wt.blacklist, null, teamId, (ev, depth, done, reason, breakdown, status) => {
          acceptState.ev = ev; acceptState.status = status; if (done) acceptState.reason = reason;
          wt.repainter.markDirty();
        });
      }
      // Skip the decline worker entirely when declining is trivial (the model
      // already knows this team can never become a captain again) - there's
      // no tree worth building, so just label it instead of running one.
      const declineIsTrivial = mtComputeDeclineTrivial(wt.rosters, teamId, wt.rankOrder);
      if (declineIsTrivial) {
        declineState.status = 'trivial'; declineState.reason = 'exact';
        wt.repainter.markDirty();
      } else {
        // Always compute decline's real EV too, even when the model's internal
        // pruning would treat it as dominated - that pruning only affects FUTURE
        // hypothetical picks deep in the recursion, not this top-level query.
        const bl = new Set(wt.blacklist); bl.add(teamId);
        wtRunSolver(wt.rosters, bl, null, teamId, (ev, depth, done, reason, breakdown, status) => {
          declineState.ev = ev; declineState.status = status; if (done) declineState.reason = reason;
          wt.repainter.markDirty();
        });
      }
    }
    return;
  }

  // offer decision
  const capIdx = wtGetActiveAllianceIdx(wt.rosters);
  const capTeamId = wt.rosters[capIdx][0];
  const isMine = wt.myTeamId === '__ANY__' || capTeamId === wt.myTeamId;
  const allAvailable = wtGetAvailable(wt.rosters, wt.blacklist);
  const candidates = allAvailable.slice(0, isMine ? 4 : 3); // only YOUR decisions get a 4th option - everyone else still sees 3
  if (candidates.length === 0) { panel.innerHTML = `<div class="cand-stats-line">No eligible teams remain to offer - draft ends here for this alliance.</div>`; return; }

  function manualPickerHtml(idPrefix) {
    const options = allAvailable.map(t => `<option value="${t.id}">${t.id} (mean ${t.mean})</option>`).join('');
    return `
      <select id="${idPrefix}Select" style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:11px 8px;font-family:var(--mono);font-size:13px;margin-bottom:8px;margin-top:10px;min-height:44px;">${options}</select>
      <button id="${idPrefix}Confirm" style="width:100%;">Record this pick</button>`;
  }

  if (!isMine) {
    panel.innerHTML = `
      <div class="decision-header">Alliance #${capIdx + 1} Captain (${capTeamId}):</div>
      <div class="btn-row" id="wtOfferChoices"></div>
      ${manualPickerHtml('wtManualOffer')}`;
    const row = document.getElementById('wtOfferChoices');
    candidates.forEach(c => {
      const btn = document.createElement('button');
      btn.textContent = `${c.id} (mean ${c.mean})`;
      btn.className = 'choice-btn';
      btn.onclick = () => {
        wtCommit(`Alliance #${capIdx + 1} (${capTeamId}) offered ${c.id}.`, wt.rosters, wt.blacklist, { allianceIdx: capIdx, teamId: c.id });
      };
      row.appendChild(btn);
    });
    document.getElementById('wtManualOfferConfirm').onclick = () => {
      const picked = document.getElementById('wtManualOfferSelect').value;
      wtCommit(`Alliance #${capIdx + 1} (${capTeamId}) offered ${picked} (manual entry).`, wt.rosters, wt.blacklist, { allianceIdx: capIdx, teamId: picked });
    };
  } else {
    const headerText = wt.myTeamId === '__ANY__'
      ? `Alliance #${capIdx + 1} Captain (${capTeamId}):`
      : `Alliance #${capIdx + 1} Captain (${capTeamId}):`;
    panel.innerHTML = `<div class="decision-header">${headerText}</div><div id="wtOfferRecommendWrap"></div>${manualPickerHtml('wtManualOfferMine')}`;
    const wrap = document.getElementById('wtOfferRecommendWrap');
    const candStates = candidates.map(c => ({ id: c.id, mean: c.mean, ev: null, status: '', reason: null }));
    function statusText(cs) { return cs.reason === 'memory' ? 'memory' : cs.status; }
    function declineText(cs, field) {
      if (cs.declineTrivial) return '-----';
      const v = cs[field];
      if (v === undefined) return '…';
      if (v === null) return '-----';
      return v.toFixed(3);
    }
    function paint() {
      const bestEv = Math.max(...candStates.map(cs => cs.ev != null ? cs.ev : -Infinity));
      wrap.innerHTML = candStates.map((cs, i) => `
        <div class="cand-row">
          <button type="button" class="cand-box cand-box-btn ${cs.ev != null && cs.ev === bestEv ? 'leading' : ''}" data-pick-index="${i}">
            <div class="cand-box-flex">
              <div class="cb-left">
                <span><span class="cb-team">${cs.id}</span> <span class="cb-mean">${cs.mean}</span></span>
                <span class="cb-ev">${cs.ev != null ? cs.ev.toFixed(3) : '…'}</span>
                <span class="cb-status">${statusText(cs)}</span>
              </div>
              <div class="cb-right">
                <span class="cb-green">${cs.myEvIfAccept != null ? cs.myEvIfAccept.toFixed(3) : '…'}</span>
                <span class="cb-red">${declineText(cs, 'myEvIfDecline')}</span>
                <span class="cb-blue">${cs.candEvIfAccept != null ? cs.candEvIfAccept.toFixed(3) : '…'}</span>
                <span class="cb-yellow">${declineText(cs, 'candEvIfDecline')}</span>
              </div>
            </div>
          </button>
        </div>`).join('');
    }
    // Event delegation on the stable wrap: since repaints are now throttled
    // (not fired on every solver tick), the card's geometry stays fixed for
    // the whole interval between repaints, so making the card itself the tap
    // target no longer risks a mid-tap reflow cancelling the gesture.
    wrap.onclick = (e) => {
      const btn = e.target.closest('[data-pick-index]');
      if (!btn) return;
      const cs = candStates[+btn.dataset.pickIndex];
      wtCommit(`You (alliance #${capIdx + 1}, ${capTeamId}) offered ${cs.id} (EV ${cs.ev != null ? cs.ev.toFixed(3) : '?'}).`, wt.rosters, wt.blacklist, { allianceIdx: capIdx, teamId: cs.id });
    };
    document.getElementById('wtManualOfferMineConfirm').onclick = () => {
      const picked = document.getElementById('wtManualOfferMineSelect').value;
      wtCommit(`You (alliance #${capIdx + 1}, ${capTeamId}) offered ${picked} (manual override - no EV computed for this choice).`, wt.rosters, wt.blacklist, { allianceIdx: capIdx, teamId: picked });
    };
    wt.repainter = createThrottledPainter(paint);
    // Alliance 1 is always last to complete its roster (round 2 runs in
    // reverse, 8 down to 1) - so its second pick always leads straight to a
    // finished draft, for any candidate. No search needed: just evaluate the
    // resulting leaf directly for each candidate.
    const isAlliance1FinalPick = (capIdx === 0 && wt.rosters[0].length === 2);
    candidates.forEach((c, i) => {
      if (isAlliance1FinalPick) {
        const finalRosters = wtApplyAccept(wt.rosters, capIdx, c.id, wt.rankOrder);
        const vec = mtEvaluateLeaf(finalRosters, teams);
        candStates[i].ev = vec[capTeamId] || 0;
        candStates[i].status = 'trivial';
        candStates[i].reason = 'exact';
        candStates[i].myEvIfAccept = vec[capTeamId] || 0;
        candStates[i].candEvIfAccept = vec[c.id] || 0;
        candStates[i].myEvIfDecline = null;
        candStates[i].candEvIfDecline = null;
        candStates[i].declineTrivial = true;
        wt.repainter.markDirty();
        return;
      }
      wtRunSolver(wt.rosters, wt.blacklist, { allianceIdx: capIdx, teamId: c.id }, capTeamId, (ev, depth, done, reason, breakdown, status) => {
        candStates[i].ev = ev; candStates[i].status = status;
        if (breakdown) {
          candStates[i].myEvIfAccept = breakdown.myEvIfAccept; candStates[i].myEvIfDecline = breakdown.myEvIfDecline;
          candStates[i].candEvIfAccept = breakdown.candidateEvIfAccept; candStates[i].candEvIfDecline = breakdown.candidateEvIfDecline;
          candStates[i].declineTrivial = breakdown.declineTrivial;
        }
        if (done) candStates[i].reason = reason;
        wt.repainter.markDirty();
      });
    });
  }
}

document.getElementById('btnStartWalkthrough').onclick = async () => {
  const apiKey = document.getElementById('tbaKey').value.trim();
  const eventKey = document.getElementById('tbaEvent').value.trim();
  const startBtn = document.getElementById('btnStartWalkthrough');
  // Capture the user's choice BEFORE any re-import, since a successful
  // import rebuilds the <select> from scratch (populateTeamSelect), which
  // resets it back to its first option ("__ANY__") - silently discarding
  // whatever the user had picked, even though they never touched the
  // dropdown again. Re-import happens on every Start click because the TBA
  // key/event fields are pre-filled, not just the first time.
  const myTeamIdBeforeImport = document.getElementById('wtTeamSelect').value;
  if (apiKey && eventKey) {
    startBtn.disabled = true;
    startBtn.textContent = 'Importing…';
    try { await importFromTBA(); } catch (e) { /* silently continue with existing team data on failure */ }
    startBtn.disabled = false;
    startBtn.textContent = 'Start walkthrough \u2192';
  }
  // If the previously-selected team still exists after the (re)import (the
  // common case: same event, same teams come back), restore that exact
  // selection. Only if it genuinely no longer exists (team IDs actually
  // changed - e.g. first-ever import replacing placeholder T1/T2/... with
  // real TBA numbers) do we fall back to whatever the reset dropdown shows.
  const sel = document.getElementById('wtTeamSelect');
  const stillExists = Array.from(sel.options).some(o => o.value === myTeamIdBeforeImport);
  const myTeamId = stillExists ? myTeamIdBeforeImport : sel.value;
  document.getElementById('setupPanels').style.display = 'none';
  document.getElementById('walkthroughPanel').style.display = 'block';
  document.getElementById('topSubtitle').textContent = '';
  initWalkthroughFromData(teams, myTeamId);
};

document.getElementById('btnBackToSetup').onclick = (e) => {
  e.preventDefault();
  if (wt && wt.activeWorkers) wt.activeWorkers.forEach(w => w.terminate());
  wt = null;
  document.getElementById('walkthroughPanel').style.display = 'none';
  document.getElementById('setupPanels').style.display = 'block';
  document.getElementById('topSubtitle').textContent = 'Load an event, pick which team you are, then start the walkthrough.';
};
</script>
